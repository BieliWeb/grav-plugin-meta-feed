title: 'Social Post'
description: 'Meta (Facebook/Instagram) social post'
type: flex-objects

config:
    admin:
        router:
            path: '/posts'
        menu:
            list:
                route: '/posts'
                title: Social Posts
                icon: fa-share-alt
                authorize: ['admin.super']
                priority: 2
        template: default
        permissions:
            admin.post:
                type: crudpl
                label: Social Posts
        list:
            title: post_id
            fields:
                active:
                    field:
                        type: toggle
                        label: Active
                    width: 8
                provider:
                    width: 12
                message:
                    width: 52
                published_at:
                    width: 20
        edit:
            title:
                template: '{{ object.provider|upper ~ " – " ~ object.post_id }}'
        preview:
            enabled: false
        export:
            enabled: false

    site:
        templates:
            collection:
                paths:
                    - 'flex/{TYPE}/collection/{LAYOUT}{EXT}'
            object:
                paths:
                    - 'flex/{TYPE}/object/{LAYOUT}{EXT}'
            defaults:
                type: post
                layout: default

    data:
        object: 'Grav\Plugin\MetaFeed\Flex\Types\Post\PostObject'
        collection: 'Grav\Plugin\MetaFeed\Flex\Types\Post\PostCollection'
        index: 'Grav\Common\Flex\Types\Generic\GenericIndex'
        storage:
            class: 'Grav\Framework\Flex\Storage\FolderStorage'
            options:
                formatter:
                    class: 'Grav\Framework\File\Formatter\JsonFormatter'
                folder: user-data://meta-feed/posts
        search:
            options:
                contains: 1
            fields:
                - provider
                - message

form:
    validation: loose
    fields:
        active:
            type: toggle
            label: Active
            highlight: 1
            default: 1
            options:
                1: 'Yes'
                0: 'No'
            validate:
                type: bool

        provider:
            type: text
            label: Provider
            disabled: true

        post_id:
            type: text
            label: Post ID
            disabled: true

        page_id:
            type: text
            label: Page / User ID
            disabled: true

        message:
            type: textarea
            label: Message
            disabled: true
            rows: 4

        image_file:
            type: text
            label: Image File
            disabled: true

        media_type:
            type: text
            label: Media Type
            disabled: true

        link:
            type: text
            label: Original Link
            disabled: true

        published_at:
            type: text
            label: Published At
            disabled: true

        fetched_at:
            type: text
            label: Fetched At
            disabled: true
