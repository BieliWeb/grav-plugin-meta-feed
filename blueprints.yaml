name: Meta Feed
slug: meta-feed
type: plugin
version: 0.1.0
description: Fetch and display Instagram and Facebook feeds using the Meta Graph API
icon: share-alt
author:
  name: Bieli Web
  email: info@bieliweb.ch
homepage: https://github.com/BieliWeb/grav-plugin-meta-feed
bugs: https://github.com/BieliWeb/grav-plugin-meta-feed/issues
docs: https://github.com/BieliWeb/grav-plugin-meta-feed/blob/main/README.md
license: MIT

compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: flex-objects, version: '>=1.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    settings_section:
      type: section
      title: Settings
      underline: true

    api_version:
      type: text
      label: Meta Graph API Version
      default: '21.0'
      help: 'e.g. 21.0'

    fetch_limit:
      type: number
      label: Posts per account to fetch
      default: 20
      validate:
        min: 1
        max: 100

    fetch_at:
      type: cron
      label: Fetch schedule
      default: '0 6 * * *'
      help: 'When to fetch new posts'

    refresh_at:
      type: cron
      label: Token refresh schedule
      default: '0 5 * * *'
      help: 'When to check tokens for upcoming expiry'

    accounts_section:
      type: section
      title: Accounts
      underline: true

    accounts:
      type: list
      label: Accounts
      style: vertical
      btnLabel: Add account
      fields:
        .name:
          type: text
          label: Display Name
          help: 'Shown in the admin and in log messages'

        .platform:
          type: select
          label: Platform
          default: instagram
          options:
            instagram: Instagram
            facebook: Facebook
          validate:
            required: true

        .page_id:
          type: text
          label: Page / User ID
          help: 'Facebook Page ID or Instagram Business Account User ID'
          validate:
            required: true

        .token_type:
          type: select
          label: Token Type
          default: page
          options:
            page: 'Page Token (permanent, recommended)'
            fb_user: 'Facebook User Token (60 days, auto-refresh)'
            ig_login: 'Instagram Login Token (60 days, auto-refresh)'

        .access_token:
          type: text
          label: Access Token

        .token_expires:
          type: text
          label: Token Expiry Date
          help: 'Format: YYYY-MM-DD — not needed for Page Tokens'
          placeholder: '2026-09-25'

        .app_id:
          type: text
          label: App ID
          help: 'Required to refresh a Facebook User Token'

        .app_secret:
          type: text
          label: App Secret
          help: 'Required to refresh a Facebook User Token'

        .use_shared_token:
          type: toggle
          label: Use shared token
          help: 'Use the access token from another account'
          default: 0
          options:
            1: PLUGIN_ADMIN.YES
            0: PLUGIN_ADMIN.NO
          validate:
            type: bool

        .shared_token_page_id:
          type: text
          label: Shared Token Page / User ID
          help: 'The Page / User ID of the account whose token to use'
